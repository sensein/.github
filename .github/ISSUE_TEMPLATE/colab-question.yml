name: "Question"
description: "A research question with hypotheses and linked evidence."
type: "Question"
body:
  - type: markdown
    attributes:
      value: "Never paste restricted content; link to it. Add typed links in a fenced links block, one per line, e.g. uses: sensein/senselab#12."
  - type: textarea
    id: question
    attributes:
      label: "Research question"
    validations:
      required: true
  - type: textarea
    id: hypotheses
    attributes:
      label: "Hypotheses"
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: <edge>: <owner>/<repo>#<n> or <edge>: kg:<id>"
      render: links
    validations:
      required: false
