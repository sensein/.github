name: "Review"
description: "A literature review: query, sources, inclusion rule, synthesis."
type: "Review"
body:
  - type: markdown
    attributes:
      value: "Never paste restricted content; link to it. Add typed links in a fenced links block, one per line, e.g. uses: sensein/senselab#12."
  - type: textarea
    id: query
    attributes:
      label: "Search query"
    validations:
      required: true
  - type: input
    id: sources
    attributes:
      label: "Sources"
    validations:
      required: true
  - type: textarea
    id: inclusion
    attributes:
      label: "Inclusion rule"
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: <edge>: <owner>/<repo>#<n> or <edge>: kg:<id>"
      render: links
    validations:
      required: false
