name: "Dataset"
description: "Curated data with a datasheet, registered with access terms."
type: "Dataset"
body:
  - type: markdown
    attributes:
      value: "Never paste restricted content; link to it. Add typed links in a fenced links block, one per line, e.g. uses: sensein/senselab#12."
  - type: textarea
    id: description
    attributes:
      label: "Description (no participant-level detail)"
    validations:
      required: true
  - type: input
    id: access
    attributes:
      label: "Access terms and data-use reference"
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: <edge>: <owner>/<repo>#<n> or <edge>: kg:<id>"
      render: links
    validations:
      required: false
